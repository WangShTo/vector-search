server:
  port: 8080

spring:
  application:
    name: vector-search-java
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 上传知识库文档用。默认只有 1MB，一篇长文档就超了
      max-file-size: 20MB
      max-request-size: 20MB

vector-search:
  # Python 模型服务地址（docker compose 里由环境变量覆盖）
  model-service-url: ${MODEL_SERVICE_URL:http://localhost:8000}
  # 调模型服务的超时（毫秒）
  model-timeout-ms: 5000

  index:
    # 向量维度，必须与 Python 侧模型严格一致：
    #   bge-small-zh-v1.5 -> 512   （当前使用）
    #   bge-base-zh-v1.5  -> 768
    #   bge-large-zh-v1.5 -> 1024
    # 写错不会静默算错：灌入第一条文档时就会报「向量维度不匹配」。
    # 这个校验在 ModelServiceClient 里，是刻意加的 —— 维度错了却拖到检索结果
    # 不对劲才发现，排查成本极高。
    dimension: 512
    # HNSW 参数，第 5 周的消融实验就改这里
    m: 16
    ef-construction: 200
    # 查询时的候选池大小，越大越准越慢 —— 这是 recall/延迟 的主旋钮
    ef-search: 100
    # 向量存储精度：
    #   f32      —— 每向量 4×dim 字节（默认，精度最高）
    #   sq8      —— 每向量 dim 字节，内存降到约 1/3.35，代价 recall@10 约 -0.08
    # 注意 sq8 只是「容量优化」不是「性能优化」：本实现把 int8 解码回 float
    # 再算点积，延迟反而高约 40%（见 bench/REPORT.md 第六节）。
    # 建索引后的精度以索引自身为准，这个值只影响「新建」的索引；
    # 已有索引的精度随快照一起存，恢复时不会被这里覆盖。
    quantization: f32
    # 索引落盘目录。
    # 注意：相对路径是相对「服务进程的工作目录」解析的，不是项目根目录。
    # 从 vector-search-java/ 启动时实际落在 vector-search-java/data/index/，
    # 启动日志会把解析后的绝对路径打出来，不用猜。
    #
    # 必须写成显式占位符：环境变量 VECTOR_SEARCH_DATA_DIR 不会自动映射到
    # vector-search.index.data-dir（relaxed binding 不做跨段的下划线转换），
    # 写成 ${...} 才会被 Spring 做占位符替换。容器里靠它指向挂载的 volume。
    data-dir: ${VECTOR_SEARCH_DATA_DIR:./data/index}

    # 上传文档的切块参数。
    # 块太大语义会被摊平（一篇 5000 字压成一个向量，既不像开头也不像中间），
    # 块太小则丢上下文。300 字左右是个常见起点。
    chunk-size: 300
    # 超长段落硬切时的重叠字符数，避免答案跨在块边界上时两边都不完整
    chunk-overlap: 50

  search:
    # 请求不指定 mode 时用哪个：vector / bm25 / hybrid
    default-mode: hybrid
    # 融合前每一路召回多少条。太小融合没得挑，太大会把噪声也带进来
    candidate-pool: 50
    # RRF 平滑常数，60 是原论文经验值，对结果不敏感
    rrf-k: 60
    # 请求不指定 rerank 时是否默认精排。默认关 ——
    # 精排要在 CPU 上对每个候选跑一次 cross-encoder，是数量级的延迟代价
    rerank-default: false
    # 精排多少条候选。延迟与精度的主旋钮：20 条约几百毫秒，50 条要一秒以上
    rerank-candidates: 20

    # 加权 RRF 的两路权重。**默认 1.0 / 1.0 = 等权**，行为与没有这两个配置时完全一致。
    #
    # 为什么要权重：等权隐含「两路可信度相同」，而实测不是 ——
    # 词面查询上 BM25 recall 0.96、向量 0.80，等权融合只有 0.89，比单跑 BM25 还差。
    # 加权就是为了修正这个不对称。
    #
    # 别凭感觉调：权重要用**独立于报告数据**的验证集选（eval/tune_weights.py），
    # 拿报告那 150 条查询调出来的权重，报告上的数字就不再是样本外表现了。
    # 0 表示这一路不参与；两个都为 0 会让服务启动失败。
    vector-weight: ${VECTOR_SEARCH_VECTOR_WEIGHT:1.0}
    bm25-weight: ${VECTOR_SEARCH_BM25_WEIGHT:1.0}

    # 拒答：库里没有答案时返回空结果，而不是硬凑 top-k。
    #
    # 最坏的失败不是「没找到」，而是「找到一堆都不对的」—— 用户没法区分
    # 「系统没有这个知识」和「系统很确定这就是答案」。
    #
    # 阈值不是拍的，来自 eval/abstain_probe.py 的实测（50 条负样本 vs 13 条自然问句
    # 正样本，判别力用 AUC 衡量）：
    #   余弦 0.915 | BM25 0.901 | cross-encoder 0.891 | RRF 融合分 0.775
    # 两个反直觉的结论：
    #   1. 免费信号（余弦/BM25）比花几百毫秒的 cross-encoder 更好 → 拒答不需要精排
    #   2. RRF 融合分最差，正负样本的分数区间完全重合 → 融合分结构上不能当阈值
    #      （k=60 时单路 rank1 只有 1/61≈0.0164，融合结果被压在 0.016-0.033 的窄带里，
    #        跟「相关不相关」没关系）
    #
    # 默认 or 规则 =「余弦 < 0.55 或 BM25 < 8.0 就拒答」：
    # 拒答 84% 的无关问题，13 条正样本误拒 0 条。
    #
    # 注意 BM25 的绝对分随语料漂（IDF、平均文档长度都会变），换语料必须重新标定；
    # 余弦做过归一化，相对稳定 —— 所以默认规则里两项不对称是故意的。
    abstention:
      enabled: true
      # vector = 只看余弦；or = 任一路低就拒（推荐）；and = 两路都低才拒（更保守）
      rule: or
      # 余弦阈值，必须在 (0,1)。低于它视为「不像」
      vector-threshold: 0.55
      # BM25 阈值，0 表示这一路不参与投票
      bm25-threshold: 8.0

  security:
    # 管理密钥。**留空 = 不启用鉴权**（本地开发默认）。
    #
    # 启用后，以下接口必须在请求头带 X-API-Key：
    #   - 任何 DELETE（删文档 / 清空知识库）
    #   - /api/admin/**（保存快照 / 切换索引）
    # 检索、统计、文档列表、上传都不拦 —— 这个项目要能当公开 demo 用。
    #
    # 部署到公网前**必须**设置，否则任何人拿到地址就能清空知识库。
    # 用环境变量注入，不要写死在这里（这个文件会被提交）：
    #   export VECTOR_SEARCH_API_KEY=$(openssl rand -hex 16)
    api-key: ${VECTOR_SEARCH_API_KEY:}

  # 注意：缩进要与其他顶层项对齐（2 个空格）。
  # 之前这里多缩进了一级，于是变成 security 下的 maintenance ——
  # Spring 对未知属性默认不报错，配置静默失效，用的还是 record 里的兜底值。
  # 兜底值恰好与想要的值相同，所以一直没暴露；改任何一个都会发现改不动。
  maintenance:
    # 删除后是否自动压实。
    #
    # 先分清两件事：
    #   即时生效 —— 删除之后，检索会把「已删除」当过滤条件推进遍历，
    #              被删的文档从下一次查询起就占不到候选名额（默认行为，无开关）。
    #   回收内存 —— HNSW 没法删单点（拿掉一个节点会断开几十条边），
    #              只能重建整张图；BM25 的 IDF 和平均长度也是全局统计量。
    #              所以「真正清理」只能按比例批量做，这就是这里配的东西。
    auto-compact: true
    # 墓碑占索引条目的比例达到多少触发。
    # 0.1 = 删掉十分之一就整理。太小会把重建变成高频操作
    # （10 万点重建一百多秒），太大则内存白白被死节点占着。
    auto-compact-ratio: 0.1

logging:
  level:
    com.vectorsearch: INFO
