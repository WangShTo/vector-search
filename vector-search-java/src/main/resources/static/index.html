<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>向量检索服务 · 知识库</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="mark">VS</div>
      <div>
        <div class="name">向量检索服务</div>
        <div class="tag">hybrid · rerank</div>
      </div>
    </div>

    <nav class="nav">
      <a href="#/search" data-route="search"><span class="ico">⌕</span>检索</a>
      <a href="#/library" data-route="library"><span class="ico">▤</span>知识库</a>
      <a href="#/ops" data-route="ops"><span class="ico">⚙</span>索引运维</a>
    </nav>

    <div class="side-foot">
      <div class="side-health" id="sideHealth"><span class="dot"></span>连接中…</div>
      <div class="side-stat"><span>向量</span><b id="statVectors">—</b></div>
      <div class="side-stat"><span>文档</span><b id="statDocs">—</b></div>
      <div class="side-stat"><span>BM25 词表</span><b id="statTerms">—</b></div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 id="pageTitle">检索</h1>
      <span class="sub" id="pageSub"></span>
      <div class="topbar-actions" id="pageActions"></div>
    </header>
    <div class="content" id="view"></div>
  </main>

</div>

<div class="toast-host" id="toastHost"></div>
<script src="app.js"></script>
</body>
</html>
