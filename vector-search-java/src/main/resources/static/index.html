<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>向量检索服务 · 演示</title>
<style>
  :root {
    --bg: #0d1017;
    --panel: #141822;
    --panel-2: #1a1f2b;
    --line: #252b3a;
    --ink: #e7eaf2;
    --ink-dim: #9198ab;
    --ink-faint: #646c80;
    --vec: #5b9dff;
    --bm25: #f0a94c;
    --hybrid: #3fd6a8;
    --warn: #ff7a7a;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 0 80px;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

  /* ---------- 头部 ---------- */
  header { padding: 36px 0 22px; border-bottom: 1px solid var(--line); margin-bottom: 28px; }
  .title-row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 21px; font-weight: 650; margin: 0; letter-spacing: -0.2px; }
  .title-row .sub { color: var(--ink-faint); font-size: 12.5px; }
  .stats { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    padding: 7px 13px; font-size: 12px; color: var(--ink-dim);
    display: flex; align-items: center; gap: 7px;
  }
  .stat b { color: var(--ink); font-family: var(--mono); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--hybrid); flex: none; }
  .dot.bad { background: var(--warn); }

  /* ---------- 搜索区 ---------- */
  .search-panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px; margin-bottom: 20px;
  }
  .input-row { display: flex; gap: 10px; }
  #q {
    flex: 1; background: var(--bg); border: 1px solid var(--line); color: var(--ink);
    border-radius: 9px; padding: 12px 15px; font-size: 14.5px; font-family: inherit;
    outline: none; transition: border-color .15s;
  }
  #q:focus { border-color: #3d4760; }
  #q::placeholder { color: var(--ink-faint); }
  #go {
    background: #2b6cf6; color: #fff; border: none; border-radius: 9px;
    padding: 0 26px; font-size: 14px; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: background .15s;
  }
  #go:hover { background: #3a7bff; }
  #go:disabled { background: #2a3350; color: var(--ink-faint); cursor: not-allowed; }

  .controls { display: flex; gap: 20px; margin-top: 15px; flex-wrap: wrap; align-items: center; }
  .group { display: flex; align-items: center; gap: 8px; }
  .group-label { font-size: 12px; color: var(--ink-faint); margin-right: 2px; }

  .chip {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-dim);
    border-radius: 7px; padding: 6px 13px; font-size: 12.5px; cursor: pointer;
    font-family: var(--mono); transition: all .13s; user-select: none;
  }
  .chip:hover { border-color: #38415a; color: var(--ink); }
  .chip[data-active="1"] { color: #0d1017; font-weight: 650; border-color: transparent; }
  .chip[data-mode="vector"][data-active="1"] { background: var(--vec); }
  .chip[data-mode="bm25"][data-active="1"] { background: var(--bm25); }
  .chip[data-mode="hybrid"][data-active="1"] { background: var(--hybrid); }
  .chip[data-toggle="rerank"][data-active="1"] { background: #b98cff; }
  .chip[data-toggle="compare"][data-active="1"] { background: #e7eaf2; }

  .hint { color: var(--ink-faint); font-size: 11.5px; }
  .examples { display: flex; gap: 7px; margin-top: 15px; flex-wrap: wrap; align-items: center; }
  .example {
    background: transparent; border: 1px dashed var(--line); color: var(--ink-dim);
    border-radius: 6px; padding: 4px 11px; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: all .13s;
  }
  .example:hover { border-color: var(--vec); color: var(--vec); border-style: solid; }

  /* ---------- 阶段耗时 ---------- */
  .timing { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 20px; }
  .timing-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 11px; }
  .timing-head h2 { font-size: 13px; font-weight: 600; margin: 0; color: var(--ink-dim); letter-spacing: .3px; }
  .timing-total { font-family: var(--mono); font-size: 13px; color: var(--ink); }
  .bar { display: flex; height: 22px; border-radius: 5px; overflow: hidden; background: var(--panel-2); }
  .bar > div { display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-family: var(--mono); color: #0d1017; font-weight: 650; overflow: hidden; white-space: nowrap; transition: width .3s; }
  .seg-embed { background: var(--bm25); }
  .seg-search { background: var(--hybrid); }
  .timing-note { margin-top: 10px; font-size: 12px; color: var(--ink-faint); }

  /* ---------- 结果 ---------- */
  .results-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 13px; }
  .results-head h2 { font-size: 14px; font-weight: 600; margin: 0; }
  .results-head .meta { color: var(--ink-faint); font-size: 12px; font-family: var(--mono); }

  .hit {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 13px 16px; margin-bottom: 9px; display: flex; gap: 14px; align-items: flex-start;
    transition: border-color .13s;
  }
  .hit:hover { border-color: #333b52; }
  .rank {
    font-family: var(--mono); font-size: 12px; color: var(--ink-faint);
    min-width: 24px; padding-top: 2px; text-align: right; flex: none;
  }
  .hit-body { flex: 1; min-width: 0; }
  .hit-top { display: flex; align-items: center; gap: 9px; margin-bottom: 5px; flex-wrap: wrap; }
  .hid { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  .score-wrap { display: flex; align-items: center; gap: 7px; }
  .score-bar { width: 78px; height: 4px; background: #232a3b; border-radius: 2px; overflow: hidden; flex: none; }
  /* 必须显式 block：span 默认是 inline，宽高会被忽略，条就整个不见了 */
  .score-fill { display: block; height: 100%; border-radius: 2px; transition: width .3s; }
  .score-num { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .badge { font-size: 10px; padding: 1px 7px; border-radius: 4px; font-family: var(--mono); }
  .badge.only { background: #2d2440; color: #b98cff; }
  .hit-text {
    font-size: 13px; color: #c3c9d8; line-height: 1.55;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; white-space: pre-wrap; word-break: break-word;
  }

  /* ---------- 对比视图 ---------- */
  .cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  .col { min-width: 0; }
  .col-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .col-head .name { font-family: var(--mono); font-size: 12.5px; font-weight: 650; }
  .col-head .kpi { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .col .hit { padding: 10px 12px; margin-bottom: 7px; }
  .col .hit-text { -webkit-line-clamp: 2; font-size: 12px; }
  .col .score-bar { width: 46px; }

  .empty { text-align: center; padding: 60px 20px; color: var(--ink-faint); font-size: 13px; }
  .err { background: #2a1620; border: 1px solid #4a2436; color: #ff9c9c; padding: 13px 16px; border-radius: 10px; font-size: 13px; }

  footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--ink-faint); font-size: 11.5px; line-height: 1.8; }
  footer code { background: var(--panel); padding: 1px 6px; border-radius: 4px; font-family: var(--mono); font-size: 11px; }
  .kbd { font-family: var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; font-size: 10.5px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-row">
      <h1>向量检索服务</h1>
      <span class="sub">Java 引擎 + Python 模型服务 · 双路召回 + RRF 融合 + 精排</span>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <section class="search-panel">
    <div class="input-row">
      <input id="q" type="text" placeholder="输入一个问题，或试试下面的示例……" autocomplete="off">
      <button id="go">检索</button>
    </div>

    <div class="controls">
      <div class="group">
        <span class="group-label">模式</span>
        <span class="chip" data-mode="vector">vector</span>
        <span class="chip" data-mode="bm25">bm25</span>
        <span class="chip" data-mode="hybrid" data-active="1">hybrid</span>
      </div>
      <div class="group">
        <span class="group-label">选项</span>
        <span class="chip" data-toggle="rerank">精排</span>
        <span class="chip" data-toggle="compare">三路对比</span>
      </div>
      <span class="hint" id="mode-hint"></span>
    </div>

    <div class="examples" id="examples"></div>
  </section>

  <div id="timing-host"></div>
  <div id="out"></div>

  <footer>
    分数条是<strong>本次结果内的相对值</strong>——不同模式的分数完全不可比：
    余弦相似度在 <code>[-1, 1]</code>、BM25 无上界、RRF 只看排名、cross-encoder 输出另一个量纲。
    这正是融合时必须用 RRF 而不是加权求和的原因。<br>
    快捷键：<span class="kbd">Enter</span> 检索 · <span class="kbd">Ctrl</span>+<span class="kbd">Enter</span> 三路对比
  </footer>
</div>

<script>
(function () {
  "use strict";

  var MODES = ["vector", "bm25", "hybrid"];
  var MODE_COLOR = { vector: "#5b9dff", bm25: "#f0a94c", hybrid: "#3fd6a8" };
  var MODE_DESC = {
    vector: "稠密向量检索：语义相近但用词不同也能命中",
    bm25: "BM25 稀疏检索：精确词匹配，且不调用模型服务",
    hybrid: "两路召回 + RRF 融合：无法预知查询类型时更稳"
  };

  var state = { mode: "hybrid", rerank: false, compare: false, busy: false };

  var $ = function (id) { return document.getElementById(id); };
  var qEl = $("q"), goEl = $("go"), outEl = $("out"), timingEl = $("timing-host"),
      statsEl = $("stats"), examplesEl = $("examples"), hintEl = $("mode-hint");

  var EXAMPLES = [
    "读得多写得少的时候该选哪种同步方式",
    "两路搜索结果怎样合并才不会被高分的那路带偏",
    "efSearch 参数是干什么的",
    "为什么测代码速度不能只跑一遍",
    "长文本要切成多大的块比较合适"
  ];

  /* ---------------- 工具 ---------------- */

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function fmtMs(v) {
    if (v == null) return "—";
    // 服务端上报的是整数毫秒，BM25 常常快到一个整数都不到
    if (v === 0) return "<1 ms";
    if (v < 10) return v.toFixed(1) + " ms";
    return Math.round(v) + " ms";
  }

  function fmtScore(v) {
    if (v == null) return "—";
    var a = Math.abs(v);
    if (a >= 100) return v.toFixed(0);
    if (a >= 1) return v.toFixed(2);
    return v.toFixed(4);
  }

  async function api(path, body) {
    var opts = body
      ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
      : { method: "GET" };
    var res = await fetch(path, opts);
    var text = await res.text();
    var data;
    try { data = text ? JSON.parse(text) : {}; } catch (e) { data = { raw: text }; }
    if (!res.ok) {
      var msg = (data && (data.message || data.error)) || ("HTTP " + res.status);
      throw new Error(msg);
    }
    return data;
  }

  /* ---------------- 统计面板 ---------------- */

  async function loadStats() {
    try {
      var s = await api("/api/stats");
      var cells = [];
      cells.push('<div class="stat"><span class="dot' + (s.modelServiceHealthy ? "" : " bad") + '"></span>模型服务 ' + (s.modelServiceHealthy ? "正常" : "不可用") + "</div>");
      cells.push('<div class="stat">向量 <b>' + (s.indexedCount || 0) + "</b> 条</div>");
      cells.push('<div class="stat">文档 <b>' + (s.storedDocuments || 0) + "</b> 篇</div>");
      if (s.sparse) {
        cells.push('<div class="stat">BM25 词表 <b>' + (s.sparse.terms || 0) + "</b> 项</div>");
      }
      if (s.hnsw) {
        cells.push('<div class="stat">图 <b>' + s.hnsw.maxLevel + "</b> 层 / <b>" + (s.hnsw.totalLinks || 0) + "</b> 边</div>");
      }
      if (s.restoredInMillis != null) {
        cells.push('<div class="stat">快照恢复 <b>' + s.restoredInMillis + "</b> ms</div>");
      }
      statsEl.innerHTML = cells.join("");
    } catch (e) {
      statsEl.innerHTML = '<div class="stat"><span class="dot bad"></span>服务未就绪：' + esc(e.message) + "</div>";
    }
  }

  /* ---------------- 交互 ---------------- */

  function setMode(m) {
    state.mode = m;
    document.querySelectorAll('.chip[data-mode]').forEach(function (c) {
      c.dataset.active = c.dataset.mode === m ? "1" : "0";
    });
    hintEl.textContent = MODE_DESC[m] || "";
  }

  function toggle(name) {
    state[name] = !state[name];
    var chip = document.querySelector('.chip[data-toggle="' + name + '"]');
    if (chip) chip.dataset.active = state[name] ? "1" : "0";
  }

  document.querySelectorAll('.chip[data-mode]').forEach(function (c) {
    c.addEventListener("click", function () { setMode(c.dataset.mode); });
  });
  document.querySelectorAll('.chip[data-toggle]').forEach(function (c) {
    c.addEventListener("click", function () { toggle(c.dataset.toggle); });
  });

  examplesEl.innerHTML = '<span class="hint">试试</span>' + EXAMPLES.map(function (q) {
    return '<button class="example">' + esc(q) + "</button>";
  }).join("");
  examplesEl.querySelectorAll(".example").forEach(function (b) {
    b.addEventListener("click", function () { qEl.value = b.textContent; run(); });
  });

  goEl.addEventListener("click", run);
  qEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { state.compare = true; syncToggle("compare"); run(); }
    else if (e.key === "Enter") { state.compare = false; syncToggle("compare"); run(); }
  });

  function syncToggle(name) {
    var chip = document.querySelector('.chip[data-toggle="' + name + '"]');
    if (chip) chip.dataset.active = state[name] ? "1" : "0";
  }

  /* ---------------- 渲染：阶段耗时 ---------------- */

  function renderTiming(timing) {
    if (!timing) { timingEl.innerHTML = ""; return; }
    var total = timing.totalMs || 1;
    var embed = Math.max(0, timing.embeddingMs || 0);
    var search = Math.max(0, timing.searchMs || 0);
    var sum = embed + search || 1;
    var ep = (embed / sum) * 100;
    var sp = (search / sum) * 100;

    var note;
    if (embed === 0) {
      note = "BM25 模式不调用模型服务，所以没有编码阶段——端到端只花本地计算的时间。";
    } else if (embed > search * 3) {
      note = "瓶颈在<b>跨进程编码</b>而不是索引本身。这时候去调 HNSW 参数是南辕北辙。";
    } else if (search > embed) {
      note = "检索段占了主要开销——很可能开着精排，CPU 上每个候选都要跑一次 cross-encoder 前向。";
    } else {
      note = "编码与检索开销相当。";
    }

    timingEl.innerHTML =
      '<div class="timing">' +
        '<div class="timing-head">' +
          "<h2>阶段耗时</h2>" +
          '<span class="timing-total">端到端 ' + fmtMs(total) + "</span>" +
        "</div>" +
        '<div class="bar">' +
          (embed > 0 ? '<div class="seg-embed" style="width:' + ep.toFixed(2) + '%">' + (ep > 12 ? "编码 " + fmtMs(embed) : "") + "</div>" : "") +
          (search > 0 ? '<div class="seg-search" style="width:' + sp.toFixed(2) + '%">' + (sp > 12 ? "检索 " + fmtMs(search) : "") + "</div>" : "") +
        "</div>" +
        '<div class="timing-note">' + note + "</div>" +
      "</div>";
  }

  /* ---------------- 渲染：结果 ---------------- */

  function renderHits(hits, color, opts) {
    opts = opts || {};
    if (!hits || !hits.length) {
      return '<div class="empty">没有命中。索引可能是空的，先灌入文档。</div>';
    }
    var maxAbs = 0;
    hits.forEach(function (h) { maxAbs = Math.max(maxAbs, Math.abs(h.score || 0)); });
    if (maxAbs === 0) maxAbs = 1;

    return hits.map(function (h, i) {
      var w = Math.min(100, Math.max(2, (Math.abs(h.score || 0) / maxAbs) * 100));
      var badge = "";
      if (opts.soloIds && opts.soloIds.has(h.id)) {
        badge = '<span class="badge only">唯一命中</span>';
      }
      return '<div class="hit">' +
        '<div class="rank">' + (i + 1) + "</div>" +
        '<div class="hit-body">' +
          '<div class="hit-top">' +
            '<span class="hid">#' + h.id + "</span>" +
            '<span class="score-wrap">' +
              '<span class="score-bar"><span class="score-fill" style="width:' + w.toFixed(1) + '%;background:' + color + '"></span></span>' +
              '<span class="score-num">' + fmtScore(h.score) + "</span>" +
            "</span>" +
            badge +
          "</div>" +
          '<div class="hit-text">' + esc(h.text || "（原文缺失）") + "</div>" +
        "</div>" +
      "</div>";
    }).join("");
  }

  function renderSingle(resp) {
    var timing = resp.timing || {};
    renderTiming(timing);
    var mode = resp.mode || state.mode;
    var color = MODE_COLOR[mode] || "#5b9dff";
    var flags = [];
    if (resp.reranked) flags.push("已精排");
    if (resp.indexType) flags.push(resp.indexType);

    outEl.innerHTML =
      '<div class="results-head">' +
        "<h2>" + esc(mode) + " 结果</h2>" +
        '<span class="meta">top ' + (resp.hits ? resp.hits.length : 0) +
          " · " + fmtMs(timing.totalMs) +
          (flags.length ? " · " + esc(flags.join(" · ")) : "") + "</span>" +
      "</div>" +
      renderHits(resp.hits, color, {});
  }

  function renderCompare(list) {
    renderTiming(null);

    // 用服务端上报的耗时，而不是客户端墙钟：
    // 三路是并行发的，墙钟只能反映最慢那一路；而客户端计时还会被
    // 无头浏览器的虚拟时间、扩展、调试器等因素污染。
    var slowest = 0;
    list.forEach(function (r) { slowest = Math.max(slowest, (r.timing || {}).totalMs || 0); });

    // 统计每个 id 出现在几路里，用于标出「只有这一路能命中」的文档
    var counts = new Map();
    list.forEach(function (r) {
      (r.hits || []).forEach(function (h) { counts.set(h.id, (counts.get(h.id) || 0) + 1); });
    });
    var soloIds = new Set();
    counts.forEach(function (n, id) { if (n === 1) soloIds.add(id); });

    var cols = list.map(function (r) {
      var mode = r.mode || "?";
      var color = MODE_COLOR[mode] || "#5b9dff";
      var timing = r.timing || {};
      return '<div class="col">' +
        '<div class="col-head">' +
          '<span class="name" style="color:' + color + '">' + esc(mode) + "</span>" +
          '<span class="kpi">' + fmtMs(timing.totalMs) + " · " + (r.hits ? r.hits.length : 0) + " 条</span>" +
        "</div>" +
        renderHits(r.hits, color, { soloIds: soloIds }) +
      "</div>";
    }).join("");

    outEl.innerHTML =
      '<div class="results-head">' +
        "<h2>三路对比</h2>" +
        '<span class="meta">同一查询 · 最慢一路 ' + fmtMs(slowest) +
          " · 紫色标签表示只有这一路能命中</span>" +
      "</div>" +
      '<div class="cols">' + cols + "</div>";
  }

  function renderError(msg) {
    timingEl.innerHTML = "";
    outEl.innerHTML = '<div class="err">检索失败：' + esc(msg) + "</div>";
  }

  /* ---------------- 主流程 ---------------- */

  async function run() {
    var q = qEl.value.trim();
    if (!q) { qEl.focus(); return; }
    if (state.busy) return;

    state.busy = true;
    goEl.disabled = true;
    goEl.textContent = "检索中…";
    outEl.innerHTML = '<div class="empty">正在检索…</div>';

    try {
      if (state.compare) {
        // 三路并行发，总耗时 ≈ 最慢那一路
        var results = await Promise.all(MODES.map(function (m) {
          return api("/api/search", { query: q, topK: 8, mode: m, rerank: state.rerank });
        }));
        renderCompare(results);
      } else {
        var resp = await api("/api/search", {
          query: q, topK: 10, mode: state.mode, rerank: state.rerank
        });
        renderSingle(resp);
      }
    } catch (e) {
      renderError(e.message);
    } finally {
      state.busy = false;
      goEl.disabled = false;
      goEl.textContent = "检索";
    }
  }

  /* ---------------- 启动 ---------------- */

  // 支持 ?q=xxx&mode=hybrid&rerank=1&compare=1 直接带查询打开。
  // 既方便把一次具体的检索结果分享给别人，也方便做截图回归。
  var params = new URLSearchParams(location.search);
  var initialMode = params.get("mode");
  setMode(MODES.indexOf(initialMode) >= 0 ? initialMode : "hybrid");

  if (params.get("rerank") === "1") { state.rerank = true; syncToggle("rerank"); }
  if (params.get("compare") === "1") { state.compare = true; syncToggle("compare"); }

  loadStats();
  qEl.focus();

  var initialQuery = params.get("q");
  if (initialQuery) {
    qEl.value = initialQuery;
    run();
  }
})();
</script>
</body>
</html>
